name: Restrict main PR source

# Fails any PR targeting `main` whose source branch is not `dev`.
# Mark this job as a required status check on the `main` ruleset to enforce.
on:
  pull_request:
    branches:
      - main

jobs:
  enforce-source-branch:
    name: PR source must be dev
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs into 'main' must come from 'dev'. Source branch was '${{ github.head_ref }}'."
            exit 1
          fi
          echo "Source branch is dev — OK."
