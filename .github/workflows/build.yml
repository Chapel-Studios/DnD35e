name: Build & Release dist

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          version="${ref#v}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Semver: anything with a `-` suffix (e.g. -poc.1, -alpha.1, -beta.2, -rc.1)
          # is a prerelease. Stable releases are bare MAJOR.MINOR.PATCH.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - run: npm ci

      - name: Set version from tag
        run: npm pkg set version="${{ steps.tag.outputs.version }}"

      - name: Build
        run: npm run build
        # prebuild automatically runs: lint, typecheck, build-system-json
        # build-system-json reads version from package.json and generates system.json

      - name: Package dist
        run: |
          test -d dist
          cd dist && zip -r "../dnd35e-dist-${{ steps.tag.outputs.tag }}.zip" . -x "**/*.map"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dnd35e-dist-${{ steps.tag.outputs.tag }}.zip
            dist/system.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
