name: Sync Phase Milestones

on:
  push:
    branches: [dev]
    paths:
      - docs/migration-plan/phases.json
  workflow_dispatch:

permissions:
  issues: write  # milestones live under the issues API
  contents: write  # commit regenerated labels.yml back to dev if it drifted

jobs:
  sync:
    name: Sync GitHub milestones from phases.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token that can push back to dev when labels.yml drifts
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install
        run: npm ci

      - name: Regenerate phase labels in labels.yml
        run: npm run generate:labels

      - name: Commit regenerated labels.yml if changed
        run: |
          if [[ -n "$(git status --porcelain .github/labels.yml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/labels.yml
            git commit -m "chore: regenerate phase labels from phases.json [skip ci]"
            git push
          else
            echo "labels.yml already in sync"
          fi

      - name: Sync milestones
        run: node scripts/sync-milestones.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
