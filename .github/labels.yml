# GitHub Issue Labels
#
# Source of truth for all labels in this repository.
# Synced to GitHub automatically on push to dev via sync-labels.yml.
# To add/rename/recolor a label, edit this file and push — the workflow applies the changes.
#
# Label name format for phases: "phase: NN — Short Title"

# ──────────────────────────────────────────
# Type labels
# ──────────────────────────────────────────
- name: "type: feature"
  color: "0075ca"
  description: "New functionality"

- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "type: enhancement"
  color: "a2eeef"
  description: "Improvement to existing functionality"

- name: "type: chore"
  color: "e4e669"
  description: "Maintenance, refactoring, or tooling"

- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"

- name: "type: test"
  color: "f9d0c4"
  description: "Test coverage"

# ──────────────────────────────────────────
# Status labels
# ──────────────────────────────────────────
- name: "status: needs review"
  color: "fbca04"
  description: "Awaiting code review"

- name: "status: blocked"
  color: "e11d48"
  description: "Blocked by another issue or external dependency"

- name: "status: good first issue"
  color: "7057ff"
  description: "Good for new contributors"

- name: "status: wontfix"
  color: "ffffff"
  description: "Will not be addressed"

- name: "status: duplicate"
  color: "cfd3d7"
  description: "Already reported"

